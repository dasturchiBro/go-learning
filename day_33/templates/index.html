<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Blog</title>
</head>
<body>
	{{template "header" .}}
	<center><h3>Welcome to my blog.</h3></center>
	<h4>Posts: </h4>
	<ul>
		{{ range . }}
		<li>
			<b>Title: </b> {{ .Title }} <br>
			<b>Body: </b> {{ .Body }} <br>
			<b>Id: </b> {{ .Id }} <br>
			<b>Published Date: </b> {{ .Date }} <br>
		</li> <br>
		{{ end }}
	</ul>
	{{template "footer" .}}
</body>
</html>
