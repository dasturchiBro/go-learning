<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Insights</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #050507;
            --bg-card: rgba(20, 20, 25, 0.6);
            --bg-card-hover: rgba(30, 30, 40, 0.8);
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 80px -20px rgba(99, 102, 241, 0.3);
            
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 25%);
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 7, 0.7);
        }

        .logo {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* --- Nav Actions --- */
        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .login-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 1.5rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .signup-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
        }

        .signup-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: 0.3s;
        }

        .signup-btn:hover::after {
            opacity: 1;
        }

        /* --- Hero Section --- */
        header {
            padding: 140px 5% 60px;
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
            position: relative;
        }

        .hero-tag {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            line-height: 1.1;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.03em;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--text-main) 20%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        /* --- Blog Grid --- */
        main {
            padding: 2rem 5% 6rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
        }

        /* --- Card Design --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            animation: fadeIn 0.6s ease-out backwards;
            display: flex;
            flex-direction: column;
        }

        /* Stagger animation for cards via JS index or CSS Nth-child */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .card-image {
            height: 220px;
            width: 100%;
            object-fit: cover;
            position: relative;
        }

        .card-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, var(--bg-card), transparent);
        }

        .category-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(5, 5, 7, 0.6);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            align-items: center;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.3;
            color: var(--text-main);
            transition: color 0.3s;
        }

        .card:hover .card-title {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-excerpt {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .author {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .author img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .author span {
            font-size: 0.85rem;
            color: #ddd;
        }

        .read-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .card:hover .read-btn {
            transform: translateX(5px);
        }

        /* --- Login Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-box {
            background: #0f0f12;
            padding: 3rem;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .modal-overlay.active .login-box {
            transform: scale(1);
        }

        .login-box h2 {
            font-family: var(--font-heading);
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .login-box p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .input-group input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .modal-btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.3s;
        }

        .modal-btn:hover {
            opacity: 0.9;
        }
        
        .close-modal {
            margin-top: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .blog-grid { grid-template-columns: 1fr; }
            header { padding-top: 120px; }
        }

    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            <i data-lucide="layers" color="#6366f1"></i>
            LUMINA
        </div>
        <div class="nav-actions">
            <button class="login-btn" onclick="openModal('login')">LOGIN</button>
            <button class="signup-btn" onclick="openModal('signup')">SIGN UP</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header>
        <span class="hero-tag">2025 Design Trends</span>
        <h1>The Future of <br><span class="gradient-text">Digital Craftsmanship</span></h1>
        <p class="hero-desc">Curated thoughts on engineering, design systems, and the evolving landscape of web architecture. Dive into the abstract.</p>
    </header>

    <!-- Main Content -->
    <main>
        <div class="grid-controls">
            <h2 class="section-title">Latest Articles</h2>
            <!-- Decorative icon for visual balance -->
            <i data-lucide="grid-3x3" color="#94a3b8"></i>
        </div>

        <div class="blog-grid" id="blog-container">
            <!-- JS will populate posts here -->
        </div>
    </main>

    <!-- Login/Signup Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-box">
            <h2 id="modal-title">Welcome Back</h2>
            <p id="modal-desc">Enter your credentials to access the dashboard.</p>
            
            <div class="input-group signup-field" style="display: none;">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="you@example.com">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••">
            </div>

            <div class="input-group signup-field" style="display: none;">
                <label>Confirm Password</label>
                <input type="password" placeholder="••••••••">
            </div>

            <button class="modal-btn" id="modal-btn">Sign In</button>
            
            <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-link" onclick="toggleMode()" style="background: none; border: none; color: var(--primary); cursor: pointer; text-decoration: underline; font-weight: 600; margin-left: 0.5rem;">Sign up</button>
            </div>

            <button class="close-modal" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Mock Data for Blog Posts
        const posts = [
            {
                title: "The Death of Flat Design",
                excerpt: "Why neumorphism failed but glassmorphism is here to stay in modern interface architecture.",
                category: "Design",
                color: "#ec4899",
                date: "Nov 21, 2025",
                time: "4 min read",
                author: "Sarah K.",
                image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop"
            },
            {
                title: "Serverless at Scale",
                excerpt: "Navigating the complexities of lambda functions when your user base hits the millions.",
                category: "Engineering",
                color: "#6366f1",
                date: "Nov 19, 2025",
                time: "8 min read",
                author: "David R.",
                image: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1000&auto=format&fit=crop"
            },
            {
                title: "Micro-interactions Matter",
                excerpt: "How subtle animations increase user retention and perceived application performance.",
                category: "UX",
                color: "#10b981",
                date: "Nov 15, 2025",
                time: "5 min read",
                author: "Elena M.",
                image: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=1000&auto=format&fit=crop"
            },
            {
                title: "The AI Copilot Revolution",
                excerpt: "Are we coding faster, or just creating more complex bugs? An honest analysis.",
                category: "AI",
                color: "#a855f7",
                date: "Nov 12, 2025",
                time: "6 min read",
                author: "James L.",
                image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=1000&auto=format&fit=crop"
            },
            {
                title: "Rust for Web Developers",
                excerpt: "Transitioning from JavaScript to Rust: The hurdles, the joys, and the compile times.",
                category: "DevOps",
                color: "#f97316",
                date: "Nov 08, 2025",
                time: "10 min read",
                author: "Sarah K.",
                image: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1000&auto=format&fit=crop"
            },
            {
                title: "Typography in VR",
                excerpt: "Designing readable text for spatial computing environments involves new rules.",
                category: "VR/AR",
                color: "#06b6d4",
                date: "Nov 03, 2025",
                time: "7 min read",
                author: "Mike T.",
                image: "https://images.unsplash.com/photo-1622979135228-5b19699436bc?q=80&w=1000&auto=format&fit=crop"
            }
        ];

        // Render Posts
        const container = document.getElementById('blog-container');

        if (container) {
            posts.forEach(post => {
                const card = document.createElement('article');
                card.className = 'card';
                
                // Random avatar generator for mock
                const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author}`;

                card.innerHTML = `
                    <div class="card-image">
                        <img src="${post.image}" alt="${post.title}" style="width:100%; height:100%; object-fit:cover;">
                        <span class="category-badge" style="border-left: 3px solid ${post.color}">${post.category}</span>
                    </div>
                    <div class="card-content">
                        <div class="meta">
                            <div class="meta-item">
                                <i data-lucide="calendar" size="14"></i>
                                ${post.date}
                            </div>
                            <div class="meta-item">
                                <i data-lucide="clock" size="14"></i>
                                ${post.time}
                            </div>
                        </div>
                        <h3 class="card-title">${post.title}</h3>
                        <p class="card-excerpt">${post.excerpt}</p>
                        <div class="card-footer">
                            <div class="author">
                                <img src="${avatarUrl}" alt="${post.author}">
                                <span>${post.author}</span>
                            </div>
                            <button class="read-btn">
                                <i data-lucide="arrow-right" size="20"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Re-run icons for dynamically added content
        lucide.createIcons();

        // Modal Logic
        let isLoginMode = true;

        function openModal(mode) {
            isLoginMode = mode === 'login';
            updateModalContent();
            document.getElementById('loginModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            updateModalContent();
        }

        function updateModalContent() {
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const btn = document.getElementById('modal-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');
            const signupFields = document.querySelectorAll('.signup-field');

            if (isLoginMode) {
                title.textContent = 'Welcome Back';
                desc.textContent = 'Enter your credentials to access the dashboard.';
                btn.textContent = 'Sign In';
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = "Sign up";
                signupFields.forEach(field => field.style.display = 'none');
            } else {
                title.textContent = 'Create Account';
                desc.textContent = 'Join our community of designers and developers.';
                btn.textContent = 'Sign Up';
                toggleText.textContent = "Already have an account?";
                toggleLink.textContent = "Log in";
                signupFields.forEach(field => field.style.display = 'block');
            }
        }

        // Close modal on outside click
        document.getElementById('loginModal').addEventListener('click', (e) => {
            if (e.target.id === 'loginModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
