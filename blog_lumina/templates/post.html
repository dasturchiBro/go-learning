{{define "post"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
    </style>
    <script src="/static/main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body class="antialiased min-h-screen">
    {{template "header" .}}
    {{template "reg" .}}

    <div class="max-w-4xl mx-auto px-4 my-5 py-12 sm:px-6 lg:px-8">
        <!-- Post Container -->
        <div class="bg-white shadow-2xl rounded-xl overflow-hidden">
            <!-- Header Section -->
            <header class="p-6 sm:p-10 border-b border-gray-100">
                <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 leading-tight mb-4">
                    {{.Post.Title}}
                </h1>
                <div class="flex items-center text-sm text-gray-500 space-x-4">
                    <a href="/user/{{.User.Id}}" class="font-medium text-indigo-600">Author: {{.User.Name}}</a>
                    <span>&bull;</span>
                    <time datetime="2025-11-25">Created at: {{.CreatedAtFormatted}}</time>
                    <span>&bull;</span>
                    <time datetime="2025-11-25">Updated at: {{.UpdatedAtFormatted}}</time>
                </div>
            </header>

            <!-- Hero Image -->
            <figure>
                <!-- Placeholder image for a modern, abstract AI concept -->
                <img class="w-full h-80 object-cover"
                     src="{{.Post.Image}}"
                     alt="Abstract visualization of artificial intelligence and creative process"
                     onerror="this.onerror=null; this.src='{{.Post.Image}}';"
                />
            </figure>

            <!-- Content Section -->
            <article class="prose max-w-none p-6 sm:p-10 text-gray-700 leading-relaxed">
                {{.Post.Body}}
            </article>

        </div>
    </div>

</body>
</html>
{{end}}
