{{define "create"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Optional: Center the form container */
        .form-container {
            max-width: 600px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    {{template "header" .}}
    <div class="container form-container pb-5 mb-4">
        <h2 class="mb-4 text-center">📝 Create a New Post</h2>
        
        <div class="card shadow-lg p-4">
            <form action="/save_post" method="POST">
                
                <input type="hidden" id="id" name="id" value="0">
                
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">Post Title</label>
                    <input type="text" 
                           class="form-control" 
                           id="title" 
                           name="title" 
                           placeholder="Enter the title of your post" 
                           required 
                           maxlength="255">
                    <div class="form-text">
                        The title should be clear and concise.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="body" class="form-label fw-bold">Post Body</label>
                    <textarea class="form-control" 
                              id="body" 
                              name="body" 
                              rows="8" 
                              placeholder="Write your post content here..." 
                              required></textarea>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Publish Post 🚀
                    </button>
                </div>
            </form>
        </div>
    </div>

    {{template "footer" .}}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Function to generate a large random integer (e.g., between 1000000 and 9999999)
            function generateRandomId() {
                const min = 1000000;
                const max = 9999999;
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // Get the hidden input element
            const idInput = document.getElementById('id');

            // Assign the generated random ID to the input field
            if (idInput) {
                idInput.value = generateRandomId();
                // Optional: For debugging, you can console.log the generated ID
                // console.log("Generated Post ID:", idInput.value);
            }
        });
    </script>

</body>
</html>
{{end}}
