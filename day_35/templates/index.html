{{define "index"}}
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLOG =)</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="..." crossorigin="anonymous">

</head>
<body>
	{{template "header" .}}
	<div class="w-100 h-100 p-4 border rounded bg-white mb-5">
	  <h3 class="mb-4 text-primary border-bottom pb-2">Posts:</h3>
	  
	  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
	    {{range .}}
	    <div class="col">
	      <div class="card h-100 shadow-sm border-0">
	        <div class="card-body">
	          <div class="d-flex justify-content-between align-items-center mb-2">
	            <h5 class="card-title fw-bold text-dark mb-0">
	              <span class="badge bg-primary me-2">ID: {{.Id}}</span>
	              {{.Title}}
	            </h5>
	          </div>

	          <p class="card-text text-muted mb-3">
	            <span class="fw-semibold text-dark">Body:</span> {{.Body}}
	          </p>
	        </div>
	        
	        <div class="card-footer bg-transparent border-top-0 pt-0 pb-3 ps-3">
	          <small class="text-secondary">
	            <i class="far fa-calendar-alt me-1"></i> Posted: {{.Date}}
	          </small>
	        </div>
	      </div>
	    </div>
	    {{end}}
	  </div>
	</div>
	{{template "footer" .}}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="..." crossorigin="anonymous"></script>
</body>
</html>
{{end}}
